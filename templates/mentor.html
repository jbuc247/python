{% extends 'base.html' %}
{% block title %}Mentor{% endblock %}
{% block content %}
<section class="card">
  <h2>AI Mentor</h2>
  <form method="post">
    <textarea name="question" rows="3" placeholder="Ask a coding question...">Why should I use a dictionary?</textarea>
    <button type="submit" class="button">Ask Mentor</button>
  </form>

  {% if answer %}
    <div class="result-box">
      <h3>Response</h3>
      <p>{{ answer }}</p>
    </div>
  {% endif %}
</section>
{% endblock %}
