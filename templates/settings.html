{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<section class="card">
  <h2>Settings</h2>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" value="{{ user.username }}" />
    <label>Theme</label>
    <select name="theme">
      <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
      <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
    </select>
    <label>Learning difficulty</label>
    <select name="difficulty">
      <option value="Beginner" {% if user.learning_difficulty == 'Beginner' %}selected{% endif %}>Beginner</option>
      <option value="Intermediate" {% if user.learning_difficulty == 'Intermediate' %}selected{% endif %}>Intermediate</option>
      <option value="Advanced" {% if user.learning_difficulty == 'Advanced' %}selected{% endif %}>Advanced</option>
    </select>
    <button type="submit" class="button">Save Settings</button>
  </form>
</section>
{% endblock %}
