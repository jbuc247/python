{% extends 'base.html' %}
{% block title %}Lessons{% endblock %}
{% block content %}
<section class="card">
  <h2>Learning Path</h2>
  {% for lesson in lessons %}
    <div class="lesson-item">
      <h3>{{ lesson.title }}</h3>
      <p>{{ lesson.description }}</p>
      <a href="{{ url_for('lessons.lesson_detail', slug=lesson.slug) }}" class="button">Open Lesson</a>
    </div>
  {% endfor %}
</section>
{% endblock %}
