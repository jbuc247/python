{% extends 'base.html' %}

{% block content %}
<style>
    .quiz-container {
        max-width: 800px;
        margin: 0 auto;
    }
    .question-card {
        margin-bottom: 24px;
    }
    .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 16px;
    }
    .option-label {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .option-label:hover {
        background: rgba(255,255,255,0.1);
    }
    .option-label input {
        margin-right: 12px;
    }
    .feedback-box {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        display: none;
    }
    .feedback-box.correct {
        background: rgba(16, 185, 129, 0.2);
        border-left: 4px solid var(--accent-color);
        display: block;
    }
    .feedback-box.incorrect {
        background: rgba(239, 68, 68, 0.2);
        border-left: 4px solid #ef4444;
        display: block;
    }
</style>

<div class="quiz-container">
    <div class="welcome-banner glass-panel" style="margin-bottom: 24px;">
        <h1>{{ quiz.title }} Quiz</h1>
    </div>

    <form id="quiz-form">
        {% for question in quiz.questions %}
        <div class="glass-panel question-card" id="q-{{ question.id }}">
            <h3>Question {{ loop.index }}</h3>
            <p style="font-size: 1.1rem; margin-top: 8px;">{{ question.question }}</p>
            
            <div class="options">
                {% for option in question.options %}
                <label class="option-label">
                    <input type="radio" name="q_{{ question.id }}" value="{{ option }}">
                    {{ option }}
                </label>
                {% endfor %}
            </div>
            <div class="feedback-box" id="feedback-{{ question.id }}"></div>
        </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 16px;">Submit Quiz</button>
    </form>
    
    <div id="result-banner" class="glass-panel" style="display: none; margin-top: 24px; text-align: center;">
        <h2 id="result-score"></h2>
        <a href="{{ url_for('quizzes.index') }}" class="btn btn-primary mt-3">Back to Quizzes</a>
    </div>
</div>

<script>
document.getElementById('quiz-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const answers = {};
    for (const [key, value] of formData.entries()) {
        answers[key.replace('q_', '')] = value;
    }
    
    const response = await fetch('{{ url_for("quizzes.submit_quiz", quiz_id=quiz.id) }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers })
    });
    
    const result = await response.json();
    
    // Show feedback
    for (const [qId, feedback] of Object.entries(result.feedback)) {
        const feedbackBox = document.getElementById(`feedback-${qId}`);
        feedbackBox.className = 'feedback-box ' + (feedback.correct ? 'correct' : 'incorrect');
        feedbackBox.innerText = feedback.explanation;
    }
    
    // Show result banner
    document.getElementById('quiz-form').querySelector('button[type="submit"]').style.display = 'none';
    const resultBanner = document.getElementById('result-banner');
    resultBanner.style.display = 'block';
    document.getElementById('result-score').innerText = `You scored ${result.score} out of ${result.total}!`;
});
</script>
{% endblock %}
