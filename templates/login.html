<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Python Learning Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        .auth-page {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .auth-card { width: 100%; max-width: 400px; }
        .auth-card h1 { text-align: center; margin-bottom: 6px; }
        .auth-card p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 24px; }
        .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
        .form-group label { font-weight:600; color:var(--text-muted); font-size:.9rem; }
        .form-group input {
            background:rgba(255,255,255,.07); border:1px solid var(--panel-border);
            border-radius:8px; padding:10px 14px; color:white; font-family:inherit;
        }
        .form-group input:focus { outline:none; border-color:var(--primary-color); }
        .auth-error {
            background: rgba(239,68,68,.12); border-left: 4px solid #ef4444; color: #fca5a5;
            padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: .9rem;
        }
        .auth-switch { text-align: center; margin-top: 16px; color: var(--text-muted); font-size: .9rem; }
        .auth-switch a { color: var(--primary-color); text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="glass-panel auth-card">
            <h1>🐍 PyLab</h1>
            <p class="subtitle">Log in to continue your Python journey</p>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
        </div>
    </div>
</body>
</html>
